<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07080c">
  <title>Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #07080c; color: #eef1f6; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    main { max-width: 28rem; }
    h1 { font-size: 1.6rem; margin: 0 0 12px; }
    p { color: #aab2c0; line-height: 1.5; margin: 0 0 20px; }
    button { background: #2f7fd1; color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>We could not reach the server. Check your connection and try again. Your servers keep running while you are away.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
