name: Release

# working: every push rebuilds one rolling prerelease, working-latest, at the current VERSION.
# testing: every push that changes the branch bumps VERSION from the commits since the last
# testing release (BREAKING CHANGE or type! -> major, feat -> minor, anything else -> fix),
# commits the new VERSION back with [skip ci], and publishes testing-<version>.
# The bump commit uses GITHUB_TOKEN, which does not start another workflow run.
on:
  push:
    branches: [working, testing]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump the version, build the archive and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CUR=$(tr -d '[:space:]' < VERSION)
          if [ -z "$CUR" ]; then echo 'VERSION is empty' >&2; exit 1; fi
          CODE=$(awk -F"'" '/PANEL_VERSION/ {print $4}' includes/panel_version.php)
          if [ "$CODE" != "$CUR" ]; then echo "PANEL_VERSION ($CODE) does not match VERSION ($CUR)" >&2; exit 1; fi
          NEW="$CUR"
          if [ "$BRANCH" = "testing" ]; then
            LAST=$(git tag -l 'testing-*' | sed 's/^testing-//' | grep -E '^[0-9]+([.][0-9]+)*$' | sort -V | tail -1 || true)
            if [ -n "$LAST" ]; then
              if git diff --quiet "testing-$LAST" HEAD; then
                echo "No changes since testing-$LAST; nothing to release."
                exit 0
              fi
              if [ "$(printf '%s\n%s\n' "$LAST" "$CUR" | sort -V | tail -1)" = "$CUR" ] && [ "$CUR" != "$LAST" ]; then
                echo "VERSION $CUR was raised by hand; releasing it without a bump."
                NEW="$CUR"
              else
              BASE=$(for v in "$CUR" "$LAST"; do echo "$v"; done | sort -V | tail -1)
              MSGS=$(git log --format='%B' "testing-$LAST..HEAD")
              if echo "$MSGS" | grep -qE 'BREAKING CHANGE|^[A-Za-z]+([(][^)]*[)])?!:'; then
                KIND=major
              elif echo "$MSGS" | grep -qE '^feat([(]|:)'; then
                KIND=minor
              else
                KIND=fix
              fi
              IFS=. read -r MA MI PA <<< "$BASE"
              case "$KIND" in
                major) MA=$((MA + 1)); MI=0; PA=0 ;;
                minor) MI=$((MI + 1)); PA=0 ;;
                *) PA=$((PA + 1)) ;;
              esac
              NEW="$MA.$MI.$PA"
              if git rev-parse -q --verify "refs/tags/testing-$NEW" >/dev/null; then
                echo "testing-$NEW already exists" >&2
                exit 1
              fi
              echo "Bumping $BASE to $NEW ($KIND change)"
              echo "$NEW" > VERSION
              sed -i "s/define('PANEL_VERSION', *'$CUR')/define('PANEL_VERSION', '$NEW')/" includes/panel_version.php
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -A
              git commit -m "chore(release): testing $NEW [skip ci]"
              git push origin "HEAD:refs/heads/testing"
              fi
            fi
          fi

          SHA=$(git rev-parse HEAD)
          if [ "$BRANCH" = "testing" ]; then
            TAG="testing-$NEW"
            TITLE="testing $NEW"
          else
            TAG="working-latest"
            TITLE="working $NEW"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi
          NAME="gse-panel-$BRANCH-$NEW"
          git archive --format=zip --prefix="$NAME/" -o "$NAME.zip" HEAD
          sha256sum "$NAME.zip" | awk '{print $1}' > "$NAME.zip.sha256"
          gh release create "$TAG" "$NAME.zip" "$NAME.zip.sha256" gse-panel-install.sh --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TITLE" --notes "Built from $BRANCH at $SHA." --prerelease
