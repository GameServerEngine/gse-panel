name: Release

# The version names the code. It is bumped once, on working, and then carried unchanged by merges.
# working: every push that changes the branch bumps VERSION from the commits in that push
# (BREAKING CHANGE or type! -> major, feat -> minor, anything else -> fix), commits the new VERSION
# and PANEL_VERSION back to working with [skip ci], and rebuilds the rolling prerelease working-latest.
# testing: every push publishes testing-<version> for the VERSION already on the branch. It never
# bumps, so testing only releases code that was versioned on working. If testing-<version> exists
# but the code differs, the run fails: bump on working and merge again.
# stable: every push publishes stable-<version> as a full (non-pre) release of the VERSION already
# on the branch; the version is not bumped, because stable only receives what testing released.
# The bump commit uses GITHUB_TOKEN, which does not start another workflow run.
on:
  push:
    branches: [working, testing, stable]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump the version, build the archive and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CUR=$(tr -d '[:space:]' < VERSION)
          if [ -z "$CUR" ]; then echo 'VERSION is empty' >&2; exit 1; fi
          CODE=$(awk -F"'" '/PANEL_VERSION/ {print $4}' includes/panel_version.php)
          if [ "$CODE" != "$CUR" ]; then echo "PANEL_VERSION ($CODE) does not match VERSION ($CUR)" >&2; exit 1; fi
          NEW="$CUR"
          if [ "$BRANCH" = "working" ]; then
            # Same code as an already released testing version (for example testing merged back): keep that version.
            if git rev-parse -q --verify "refs/tags/testing-$CUR" >/dev/null && git diff --quiet "testing-$CUR" HEAD; then
              echo "Code equals testing-$CUR; keeping $CUR."
            else
              LAST=$(git tag -l 'testing-*' | sed 's/^testing-//' | grep -E '^[0-9]+([.][0-9]+)*$' | sort -V | tail -1 || true)
              BEFORE="${{ github.event.before }}"
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                MSGS=$(git log --format='%B' "$BEFORE..HEAD")
              else
                MSGS=$(git log -1 --format='%B')
              fi
              BASE="$CUR"
              if [ -n "$LAST" ]; then
                BASE=$(printf '%s\n%s\n' "$CUR" "$LAST" | sort -V | tail -1)
              fi
              if echo "$MSGS" | grep -qE 'BREAKING CHANGE|^[A-Za-z]+([(][^)]*[)])?!:'; then
                KIND=major
              elif echo "$MSGS" | grep -qE '^feat([(]|:)'; then
                KIND=minor
              else
                KIND=fix
              fi
              IFS=. read -r MA MI PA <<< "$BASE"
              case "$KIND" in
                major) MA=$((MA + 1)); MI=0; PA=0 ;;
                minor) MI=$((MI + 1)); PA=0 ;;
                *) PA=$((PA + 1)) ;;
              esac
              NEW="$MA.$MI.$PA"
              echo "Bumping $BASE to $NEW ($KIND change)"
              echo "$NEW" > VERSION
              sed -i "s/define('PANEL_VERSION', *'$CUR')/define('PANEL_VERSION', '$NEW')/" includes/panel_version.php
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -A
              git commit -m "chore(release): working $NEW [skip ci]"
              git push origin "HEAD:refs/heads/working" || { git pull --rebase origin working && git push origin "HEAD:refs/heads/working"; }
            fi
          elif [ "$BRANCH" = "testing" ]; then
            if git rev-parse -q --verify "refs/tags/testing-$NEW" >/dev/null && ! git diff --quiet "testing-$NEW" HEAD; then
              echo "testing-$NEW already exists but the code differs. Bump the version on working and merge it again." >&2
              exit 1
            fi
          fi

          SHA=$(git rev-parse HEAD)
          PRE=--prerelease
          if [ "$BRANCH" = "testing" ]; then
            TAG="testing-$NEW"
            TITLE="testing $NEW"
          elif [ "$BRANCH" = "stable" ]; then
            TAG="stable-$NEW"
            TITLE="stable $NEW"
            PRE=--latest
          else
            TAG="working-latest"
            TITLE="working $NEW"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi
          NAME="gse-panel-$BRANCH-$NEW"
          git archive --format=zip --prefix="$NAME/" -o "$NAME.zip" HEAD
          sha256sum "$NAME.zip" | awk '{print $1}' > "$NAME.zip.sha256"
          gh release create "$TAG" "$NAME.zip" "$NAME.zip.sha256" gse-panel-install.sh --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TITLE" --notes "Built from $BRANCH at $SHA." $PRE
