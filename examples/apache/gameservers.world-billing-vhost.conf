# Apache vhost for GameServers.World storefront served from the Panel repo.
# Adjust the repository path if the live checkout is not /var/www/html/GSE.

<VirtualHost *:80>
    ServerName gameservers.world
    ServerAlias www.gameservers.world

    DocumentRoot /var/www/html/GSE/modules/billing

    <Directory /var/www/html/GSE/modules/billing>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gameservers.world-error.log
    CustomLog ${APACHE_LOG_DIR}/gameservers.world-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.gameservers.world [OR]
    RewriteCond %{SERVER_NAME} =gameservers.world
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName gameservers.world
    ServerAlias www.gameservers.world

    DocumentRoot /var/www/html/GSE/modules/billing

    <Directory /var/www/html/GSE/modules/billing>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gameservers.world-error.log
    CustomLog ${APACHE_LOG_DIR}/gameservers.world-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/gameservers.world/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gameservers.world/privkey.pem
</VirtualHost>
</IfModule>
